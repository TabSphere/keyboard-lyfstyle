plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.tabsphere.keyboardlyfstyle.bridge'
version = '0.1.0'

android {
  namespace "com.tabsphere.keyboardlyfstyle.bridge"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20240303'
}
