name: Import verified Type Studio design

on:
  push:
    branches: [design/v3-type-studio]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/v3-type-studio
      - name: Check whether import is needed
        id: check
        run: |
          if [ -f .v3-import/part-00.txt ]; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.check.outputs.needed == 'true'
        with:
          python-version: '3.12'
      - name: Restore verified source and assets
        if: steps.check.outputs.needed == 'true'
        run: |
          set -euo pipefail
          cat .v3-import/part-00.txt .v3-import/part-01.txt .v3-import/part-02.txt .v3-import/part-03.txt | base64 -d | gzip -d > /tmp/type-studio.diff
          git apply --check /tmp/type-studio.diff
          git apply /tmp/type-studio.diff
          python -m pip install --quiet Pillow==13.0.0
          python .v3-import/recolor.py
      - name: Verify all 72 files against the tested build
        if: steps.check.outputs.needed == 'true'
        run: |
          set -euo pipefail
          cp .v3-import/expected-sha256.txt /tmp/type-studio-expected.txt
          sha256sum -c /tmp/type-studio-expected.txt
          test "$(find .v3-import -type f | wc -l)" -eq 7
      - name: Commit clean Type Studio tree
        if: steps.check.outputs.needed == 'true'
        run: |
          set -euo pipefail
          rm -rf .v3-import
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':(exclude).github/workflows/import-type-studio.yml'
          git commit -m 'Redesign Lyfstyle as Type Studio'
          git push origin design/v3-type-studio
