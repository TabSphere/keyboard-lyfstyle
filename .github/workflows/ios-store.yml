name: iOS store build

# Builds the signed App Store version on GitHub's Mac (instead of on EAS's build servers,
# so it doesn't use the EAS monthly build allowance) and sends it to App Store Connect.
# EAS still provides the signing certificate and profiles and the App Store Connect key,
# so the only secret needed here is EXPO_TOKEN (an Expo access token).
# Run it by hand: Actions > iOS store build > Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-store-build
  cancel-in-progress: false

jobs:
  build-and-submit:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the Expo token is set
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an EXPO_TOKEN repository secret first (expo.dev > Account settings > Access tokens)."
            exit 1
          fi
      - name: Show Xcode version
        run: xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the signed app on this Mac
        run: npx eas-cli@latest build --platform ios --profile production --local --non-interactive --output "$RUNNER_TEMP/lyfstyle.ipa"
      - name: Keep the build for 7 days
        uses: actions/upload-artifact@v4
        with:
          name: lyfstyle-ios-ipa
          path: ${{ runner.temp }}/lyfstyle.ipa
          retention-days: 7
          if-no-files-found: error
      - name: Send it to App Store Connect (TestFlight)
        run: npx eas-cli@latest submit --platform ios --profile production --path "$RUNNER_TEMP/lyfstyle.ipa" --non-interactive --wait
