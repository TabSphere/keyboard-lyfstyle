name: Store build

# Builds the signed store versions on GitHub's machines (instead of EAS's build servers,
# so they don't use the EAS monthly build allowance) and uploads them:
#   - Android: Google Play production track, as a draft release (finish it in Play Console).
#   - iPhone: App Store Connect / TestFlight.
# EAS still provides the signing keys and the store upload keys, so the only secret
# needed here is EXPO_TOKEN (an Expo access token).
# Run it by hand: Actions > Store build > Run workflow.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which app to build
        type: choice
        options: [both, android, ios]
        default: both

permissions:
  contents: read

concurrency:
  group: store-build-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  android:
    if: inputs.platform == 'both' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the Expo token is set
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an EXPO_TOKEN repository secret first (expo.dev > Account settings > Access tokens)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # The default list includes the retired 'tools' package, which makes sdkmanager fail.
          packages: platform-tools
      - run: npm ci
      - name: Build the signed app bundle on this machine
        run: npx eas-cli@latest build --platform android --profile production --local --non-interactive --output "$RUNNER_TEMP/lyfstyle.aab"
      - name: Keep the build for 7 days
        uses: actions/upload-artifact@v4
        with:
          name: lyfstyle-android-aab
          path: ${{ runner.temp }}/lyfstyle.aab
          retention-days: 7
          if-no-files-found: error
      - name: Send it to Google Play (production track, draft)
        run: npx eas-cli@latest submit --platform android --profile store --path "$RUNNER_TEMP/lyfstyle.aab" --non-interactive --wait

  ios:
    if: inputs.platform == 'both' || inputs.platform == 'ios'
    # Expo SDK 55 needs Xcode 26.
    runs-on: macos-26
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the Expo token is set
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an EXPO_TOKEN repository secret first (expo.dev > Account settings > Access tokens)."
            exit 1
          fi
      - name: Show Xcode version
        run: xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the signed app on this Mac
        run: npx eas-cli@latest build --platform ios --profile production --local --non-interactive --output "$RUNNER_TEMP/lyfstyle.ipa"
      - name: Keep the build for 7 days
        uses: actions/upload-artifact@v4
        with:
          name: lyfstyle-ios-ipa
          path: ${{ runner.temp }}/lyfstyle.ipa
          retention-days: 7
          if-no-files-found: error
      - name: Send it to App Store Connect (TestFlight)
        run: npx eas-cli@latest submit --platform ios --profile store --path "$RUNNER_TEMP/lyfstyle.ipa" --non-interactive --wait
